<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowdy - Registro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/isotipo blancoisotipo.png" type="image/png">
</head>
<body class="registration-page">
    <div class="background-overlay"></div> 
    <div class="container">
        <div class="registration-modal" id="registrationModal">
            <div class="modal-header">
                <div class="logo-container">
                    <img src="img/isotipo blancoisotipo.png" alt="Logo Flowdy" class="logo">
                    <h1>Flowdy</h1>
                </div>
                <a href="flowdy2.html" class="close-modal">&times;</a>
            </div>
            
            <div class="modal-content">
                <h2>Crear cuenta</h2>
                <p class="subtitle">Regístrate para acceder a todos los beneficios</p>
                
                <form id="registrationForm" action="https://formspree.io/f/xdalbjza" method="POST">
                    <input type="hidden" name="_subject" value="Nuevo registro Flowdy">

                    <input type="hidden" name="_next" value="flowdy2.html">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstName">Nombre</label>
                            <input type="text" id="firstName" placeholder="Escribe tu nombre" name="nombre" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="lastName">Apellidos</label>
                            <input type="text" id="lastName" placeholder="Escribe tus apellidos" name="apellidos" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">N° de Teléfono</label>
                        <input type="tel" id="phone" placeholder="Ej: 123456789" name="telefono" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="birthdate">Fecha de Nacimiento</label>
                        <input type="date" id="birthdate" name="fecha_nacimiento" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="correo@ejemplo.com" name="email" required>
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" placeholder="********" name="contrasena" required>
                            <div class="password-strength"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Contraseña</label>
                            <input type="password" id="confirmPassword" placeholder="********" name="confirmar_contrasena" required>
                        </div>

                    </div>
                    
                    <div class="terms-container">
                        <input type="checkbox" id="terms" name="acepta_terminos" required>
                        <label for="terms">Acepto los <a href="#" class="terms-link">Términos y Condiciones</a> y la <a href="#" class="terms-link">Política de Privacidad</a></label>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Crear cuenta</button>
                        <a href="flowdy2.html" class="btn-cancel">Cancelar</a>
                    </div>
                    
                    <div class="login-link">
                        ¿Ya tienes una cuenta? <a href="#" class="link">Inicia sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
